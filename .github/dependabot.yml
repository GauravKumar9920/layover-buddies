version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # Expo SDK 52 owns this native dependency matrix. Keep patch updates
    # available, but make minor/major platform changes through a coordinated
    # Expo SDK upgrade instead of independent Dependabot PRs.
    ignore:
      # React 19 requires a coordinated Expo/React Native and web-renderer
      # migration. Expo 52 validates React/react-dom 18.3.1 and React 18 types.
      # Only version-update majors are ignored; security updates remain enabled.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      # Expo 52's Babel preset and native plugins target Babel 7. ESLint 9+
      # needs a flat-config migration from apps/mobile/.eslintrc.json.
      - dependency-name: "@babel/core"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # Major toolchain/API migrations need a dedicated compatibility task.
      # Continue automated patch/minor updates for these current app versions.
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "zod"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "zustand"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "date-fns"
        update-types:
          - "version-update:semver-major"
      # Scoped native packages also belong to the Expo SDK matrix.
      - dependency-name: "@react-native*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # NativeWind 4 requires Tailwind 3; migrate the styling stack together.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      # Match the oldest supported Node runtime rather than unreleased APIs.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Expo 52 requires this exact version, including its patch number.
      - dependency-name: "react-native-maps"
        versions: ["*"]
      - dependency-name: "expo*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-native*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      npm-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  # Keep immutable workflow action pins current through reviewed PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
