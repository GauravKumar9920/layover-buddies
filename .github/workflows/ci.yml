name: CI

# Runs on every push to main and every pull request targeting main.
# Independent jobs run in parallel — fast feedback, and a failure in one area
# doesn't mask issues in the others.
#
# This is an npm-workspaces monorepo: a single root `npm ci` installs every
# application workspace plus packages/* from the root package-lock.json, then
# each job runs the relevant workspace script via `npm run <task> -w <name>`.
# Sanity Studio is intentionally isolated with its own React 19 lockfile.
#
# What this catches:
#   - TypeScript errors (wrong field names, missing imports, type mismatches)
#   - ESLint violations (unused vars, dead code, common React mistakes)
#   - Failing unit tests (mobile Jest suite + Deno edge-function tests):
#     booking state machine, CTA mapping, late fees, reconciliation, webhook
#     signatures, push copy
#   - Migrations that fail to apply cleanly (syntax errors, missing columns,
#     conflicts with previous migrations, broken RLS policies)
#   - Broken admin production build; missing/invalid marketing static site
#
# What this does NOT catch:
#   - Runtime errors, layout bugs, or anything you can only see by running the
#     app. For those, see docs/technical/TESTING.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN: every job here only reads the repo (install,
# typecheck, lint, test, build). No job writes to the repo, so deny everything
# except read access to contents.
permissions:
  contents: read

jobs:
  mobile:
    name: mobile · typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Reject committed Google API keys
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}'; then
            echo '::error::A Google API key is committed to the repository'
            exit 1
          fi
      - name: Install (workspaces)
        run: npm ci
      - name: Verify patched untrusted-image parser guards
        run: npm run test:dependency-security
      - name: Type check
        run: npm run type-check --workspace @detour/mobile
      - name: Lint
        run: npm run lint --workspace @detour/mobile
      # Jest suite: booking state machine, CTA mapping, late fees, cancellation/
      # reconciliation/agreement snapshots, push-token registration.
      - name: Test
        run: npm test --workspace @detour/mobile -- --ci

  admin-build:
    name: admin · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install (workspaces)
        run: npm ci
      # admin's build script runs `tsc -b && vite build` — covers type-check
      # and the production bundle in one step.
      - name: Build
        run: npm run build --workspace @detour/admin
      - name: Test API contracts and security invariants
        run: npm test --workspace @detour/admin
      - name: Verify the browser bundle contains no privileged credentials
        run: npm run security:admin-bundle

  edge-test:
    name: edge · test
    runs-on: ubuntu-latest
    # Deno unit tests for Supabase edge functions: Razorpay webhook signature
    # verification, deposit-capture flow, push send + copy. No DB needed —
    # these are pure-logic tests over the function helpers.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check admin and growth boundaries
        run: |
          deno check supabase/functions/admin-api/index.ts
          deno check supabase/functions/admin-growth-report/index.ts
          deno check supabase/functions/submit-marketing-lead/index.ts
          deno check supabase/functions/sync-search-console/index.ts
          deno check supabase/functions/content-deployment-webhook/index.ts
      - name: Test edge functions
        run: deno test --allow-env --no-check supabase/functions/__tests__/

  marketing-check:
    name: marketing · check
    runs-on: ubuntu-latest
    # The marketing workspace produces the static site deployed by Vercel.
    # The build also validates Astro content and route generation.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install (workspaces)
        run: npm ci
      - name: Build and validate marketing routes
        run: npm run build --workspace @detour/marketing
      - name: Check URL, metadata and generated-route parity
        run: npm test --workspace @detour/marketing

  studio-check:
    name: studio · typecheck + schema + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install isolated Studio dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Validate schemas
        run: npm test
      - name: Build
        run: npm run build

  db-migrations:
    name: db · migrations apply cleanly
    runs-on: ubuntu-latest
    # Spins up the full local Supabase stack and applies every migration in
    # `supabase/migrations/` to a fresh database. If a migration has bad SQL,
    # references a column that doesn't exist, or conflicts with a previous
    # migration, this step fails loudly.
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (applies migrations to fresh DB)
        run: supabase start
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
