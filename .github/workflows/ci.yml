name: CI

# Runs on every push to main and every pull request targeting main.
# Independent jobs run in parallel — fast feedback, and a failure in one
# workspace doesn't mask issues in the others.
#
# What this catches:
#   - TypeScript errors (wrong field names, missing imports, type mismatches)
#   - ESLint violations (unused vars, dead code, common React mistakes)
#   - Failing unit tests (mobile Jest suite + Deno edge-function tests):
#     booking state machine, CTA mapping, late fees, reconciliation, webhook
#     signatures, push copy
#   - Migrations that fail to apply cleanly (syntax errors, missing columns,
#     conflicts with previous migrations, broken RLS policies)
#   - Broken admin production build; missing/invalid marketing static site
#
# What this does NOT catch:
#   - Runtime errors, layout bugs, or anything you can only see by running the app.
#     For those, see TESTING.md at the repo root.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-typecheck:
    name: mobile · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm --prefix mobile ci
      - name: Type check
        run: npm --prefix mobile run type-check

  mobile-lint:
    name: mobile · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm --prefix mobile ci
      - name: Lint
        run: npm --prefix mobile run lint

  mobile-test:
    name: mobile · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm --prefix mobile ci
      # Jest suite: booking state machine, CTA mapping, late fees, cancellation/
      # reconciliation/agreement snapshots, push-token registration.
      - name: Test
        run: npm --prefix mobile test -- --ci

  edge-test:
    name: edge · test
    runs-on: ubuntu-latest
    # Deno unit tests for Supabase edge functions: Razorpay webhook signature
    # verification, deposit-capture flow, push send + copy. No DB needed —
    # these are pure-logic tests over the function helpers.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test edge functions
        run: deno test --allow-env --no-check supabase/functions/__tests__/

  admin-build:
    name: admin · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm --prefix admin ci
      # admin's build script runs `tsc -b && vite build` — covers type-check
      # and the production bundle in one job. Skip env vars: vite ignores
      # missing VITE_* at build time, only fails at runtime.
      - name: Build
        run: npm --prefix admin run build

  marketing-check:
    name: marketing · check
    runs-on: ubuntu-latest
    # The live marketing site (web/marketing/) is static HTML deployed by
    # Vercel — there is no build step. The old root Vite site was archived to
    # web/old-template/ and is no longer shipped, so we no longer build it.
    # This job validates the shipped static site has its required entry pages
    # and that they're well-formed enough to be real HTML (catches an empty
    # file or a bad move/rename).
    steps:
      - uses: actions/checkout@v4
      - name: Validate static marketing site
        run: |
          set -euo pipefail
          for f in web/marketing/index.html web/marketing/careers.html web/marketing/vercel.json; do
            test -s "web/marketing/$(basename "$f")" || { echo "::error::Missing or empty $f"; exit 1; }
          done
          for f in web/marketing/index.html web/marketing/careers.html; do
            grep -qiE '<!doctype html|<html' "$f" || { echo "::error::$f does not look like HTML"; exit 1; }
          done
          echo "✓ web/marketing static site present and well-formed"

  db-migrations:
    name: db · migrations apply cleanly
    runs-on: ubuntu-latest
    # Spins up the full local Supabase stack and applies every migration in
    # `supabase/migrations/` to a fresh database. If a migration has bad SQL,
    # references a column that doesn't exist, or conflicts with a previous
    # migration, this step fails loudly.
    #
    # NOTE: `supabase db reset --no-seed` was removed. In CI every runner
    # starts clean, so `supabase start` already applies migrations to a brand-
    # new DB — the reset step was redundant and caused flaky 502 errors from
    # the container-restart health-check race that follows a reset.
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (applies migrations to fresh DB)
        run: supabase start
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
